<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Farm-to-Door</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header id="navbar"></header>

  <div class="auth-page">
    <div class="card auth-box">
      <h2>Welcome Back 👋</h2>
      <p class="sub">Login to continue</p>

      <!-- Only 2 logins: Customer and Admin -->
      <div class="role-tabs">
        <button class="active" id="customerTab" onclick="selectRole('customer')"><i class="fa-solid fa-user"></i> Customer</button>
        <button id="adminTab" onclick="selectRole('admin')"><i class="fa-solid fa-user-shield"></i> Admin</button>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="••••••" required>
        </div>
        <button type="submit" class="btn btn-green btn-block" id="loginBtn">Login</button>
      </form>

      <p class="switch" id="registerLink">New here? <a href="register.html">Create a customer account</a></p>

      <div class="demo-note" id="demoNote">
        <b>Demo customer:</b> customer@farmtodoor.lk / customer123
      </div>
    </div>
  </div>

  <script src="js/cart.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
