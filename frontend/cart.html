<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart | Farm-to-Door</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header id="navbar"></header>

  <div class="page-banner">
    <h1>🛒 Your Basket</h1>
    <p>Review your items and checkout</p>
  </div>

  <section>
    <div class="container cart-layout">

      <!-- Cart items -->
      <div class="card">
        <h3 style="margin-bottom:10px"><i class="fa-solid fa-basket-shopping" style="color:var(--green)"></i> Cart Items</h3>
        <div id="cartItems"></div>
      </div>

      <!-- Checkout form -->
      <div class="card" id="checkoutBox">
        <h3 style="margin-bottom:16px"><i class="fa-solid fa-truck" style="color:var(--orange)"></i> Delivery Details</h3>

        <form id="checkoutForm">
          <div class="form-group">
            <label>Phone</label>
            <input type="tel" id="phone" placeholder="07XXXXXXXX" required>
          </div>
          <div class="form-group">
            <label>Delivery Address</label>
            <textarea id="address" rows="2" placeholder="House no, Street" required></textarea>
          </div>
          <div class="form-group">
            <label>City</label>
            <select id="city" required></select>
          </div>

          <!-- Strategy pattern: customer chooses how fee is calculated -->
          <div class="form-group">
            <label>Delivery Method</label>
            <div class="radio-group">
              <label class="radio-option"><input type="radio" name="method" value="flat" checked> Flat Rate (Rs. 250 any city)</label>
              <label class="radio-option"><input type="radio" name="method" value="distance"> Distance Based (Rs. 100 + Rs. 10/km)</label>
            </div>
          </div>

          <div class="form-group">
            <label>Payment</label>
            <div class="radio-option"><input type="radio" checked disabled> 💵 Cash on Delivery</div>
          </div>

          <div class="summary-row"><span>Subtotal</span><span id="subtotal">Rs. 0.00</span></div>
          <div class="summary-row"><span>Delivery Fee <small id="distanceText"></small></span><span id="deliveryFee">Rs. 0.00</span></div>
          <div class="summary-row total"><span>Total</span><span id="total">Rs. 0.00</span></div>

          <button type="submit" class="btn btn-green btn-block" id="placeOrderBtn" style="margin-top:14px">
            <i class="fa-solid fa-check"></i> Place Order
          </button>
        </form>
      </div>
    </div>
  </section>

  <div id="footer"></div>

  <script src="js/cart.js"></script>
  <script src="js/api.js"></script>
  <script src="js/cart-page.js"></script>
</body>
</html>
