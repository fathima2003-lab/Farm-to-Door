<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders | Farm-to-Door</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header id="navbar"></header>

  <div class="page-banner">
    <h1>📦 My Orders</h1>
    <p>Track your deliveries in real time</p>
  </div>

  <section>
    <div class="container orders-layout">
      <div id="ordersList">
        <p class="loading"><i class="fa-solid fa-spinner fa-spin"></i> Loading orders...</p>
      </div>

      <!-- Notifications (Observer pattern) -->
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px">
          <h3><i class="fa-solid fa-bell" style="color:var(--orange)"></i> Notifications</h3>
          <button class="btn btn-light btn-sm" onclick="markAllRead()">Mark all read</button>
        </div>
        <ul class="notif-list" id="notifList"></ul>
      </div>
    </div>
  </section>

  <div id="footer"></div>

  <script src="js/cart.js"></script>
  <script src="js/api.js"></script>
  <script src="js/orders.js"></script>
</body>
</html>
