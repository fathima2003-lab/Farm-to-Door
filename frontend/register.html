<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Farm-to-Door</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header id="navbar"></header>

  <div class="auth-page">
    <div class="card auth-box">
      <h2>Join Farm-to-Door 🌱</h2>
      <p class="sub">Create your customer account</p>

      <form id="registerForm">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="name" placeholder="Your name" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Phone</label>
            <input type="tel" id="phone" placeholder="07XXXXXXXX" pattern="0[0-9]{9}" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Min 6 characters" minlength="6" required>
          </div>
        </div>
        <div class="form-group">
          <label>Address</label>
          <input type="text" id="address" placeholder="No, Street, City">
        </div>
        <button type="submit" class="btn btn-orange btn-block">Register</button>
      </form>

      <p class="switch">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </div>

  <script src="js/cart.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
